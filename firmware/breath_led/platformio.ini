; Desk breathing LED (Nucleo-C031C6). Uses lib/grounded_led, shared with the Mac's virtual LED.
; Build:   pio run         (inside firmware/breath_led)
; Output:  .pio/build/nucleo_c031c6/firmware.elf  (upload to Wokwi together with diagram.json)

[env:nucleo_c031c6]
platform = ststm32
board = nucleo_c031c6
framework = arduino
lib_extra_dirs = ../lib
build_flags =
    -Wdouble-promotion
    ; This firmware needs timers (PWM) and the serial port, but not these:
    -D HAL_ADC_MODULE_DISABLED
    -D HAL_I2C_MODULE_DISABLED
    -D HAL_SPI_MODULE_DISABLED
