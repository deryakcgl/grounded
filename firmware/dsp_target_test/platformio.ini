; Builds grounded_dsp for the STM32 and tests it with real data.
; Build:   pio run         (inside firmware/dsp_target_test)
; Output:  .pio/build/nucleo_c031c6/firmware.elf  (Wokwi runs this)

[env:nucleo_c031c6]
platform = ststm32
board = nucleo_c031c6
framework = arduino
lib_extra_dirs = ../lib
build_flags =
    -Wdouble-promotion
    ; Leave out HAL code for peripherals we don't use (saves flash).
    ; This test only needs the serial port and time (SysTick).
    -D HAL_ADC_MODULE_DISABLED
    -D HAL_I2C_MODULE_DISABLED
    -D HAL_SPI_MODULE_DISABLED
    -D HAL_TIM_MODULE_DISABLED
