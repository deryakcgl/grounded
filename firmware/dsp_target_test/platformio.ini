; grounded_dsp'yi STM32 icin derler ve gercek veriyle test eder.
; Derleme:  pio run         (firmware/dsp_target_test icinde)
; Cikti:    .pio/build/nucleo_c031c6/firmware.elf  (Wokwi bunu calistirir)

[env:nucleo_c031c6]
platform = ststm32
board = nucleo_c031c6
framework = arduino
lib_extra_dirs = ../lib
build_flags =
    -Wdouble-promotion
    ; Kullanmadigimiz cevre birimlerinin HAL kodunu derlemeye dahil etme (flash tasarrufu).
    ; Bu testte sadece seri port ve zaman (SysTick) lazim.
    -D HAL_ADC_MODULE_DISABLED
    -D HAL_I2C_MODULE_DISABLED
    -D HAL_SPI_MODULE_DISABLED
    -D HAL_TIM_MODULE_DISABLED
