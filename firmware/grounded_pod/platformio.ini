[env]
platform = ststm32
board = nucleo_c031c6
framework = arduino
lib_extra_dirs = ../lib
build_flags =
    -Wdouble-promotion
    -D HAL_ADC_MODULE_DISABLED
    -D HAL_I2C_MODULE_DISABLED
    -D HAL_TIM_MODULE_DISABLED

[env:nucleo_c031c6]
build_src_filter = +<main.cpp>

[env:bringup]
build_src_filter = +<bringup.cpp>

[env:l476rg]
board = nucleo_l476rg
build_flags = ${env.build_flags} -ffp-contract=off
build_src_filter = +<main.cpp>

[env:bringup_l476rg]
board = nucleo_l476rg
build_flags = ${env.build_flags} -ffp-contract=off
build_src_filter = +<bringup.cpp>
