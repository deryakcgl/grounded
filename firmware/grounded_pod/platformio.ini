; Chest pod prototype: ADS1292R -> detectors -> protocol lines over serial.
; Nucleo-C031C6 for now (the product will use an STM32WB for Bluetooth).
; Build:   pio run         (inside firmware/grounded_pod)
;
; Wiring (Arduino header names):
;   ADS1292R  SCLK -> D13   DOUT -> D12 (MISO)   DIN -> D11 (MOSI)   CS -> D10
;             DRDY -> D9    PWDN/RESET -> D8     START -> GND (started by command)
;             CLKSEL -> DVDD (internal 512 kHz clock)
;   Heartbeat LED (with 220 ohm resistor) -> D7

[env:nucleo_c031c6]
platform = ststm32
board = nucleo_c031c6
framework = arduino
lib_extra_dirs = ../lib
build_flags =
    -Wdouble-promotion
    -D HAL_ADC_MODULE_DISABLED
    -D HAL_I2C_MODULE_DISABLED
    -D HAL_TIM_MODULE_DISABLED
